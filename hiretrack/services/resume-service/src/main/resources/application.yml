spring:
  application:
    name: resume-service
  threads:
    virtual:
      enabled: true                      # virtual threads for blocking I/O (JDBC, HTTP calls)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hiretrack}
    username: ${DB_USER:resume_svc}
    password: ${DB_PASSWORD:resume_pw}
    hikari:
      schema: resume                   # search_path for JPA and JdbcTemplate
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none                     # Flyway owns the schema
    properties:
      hibernate:
        default_schema: resume
        jdbc.time_zone: UTC
  flyway:
    schemas: resume
    default-schema: resume
    locations: classpath:db/migration,classpath:db/platform/outbox,classpath:db/platform/idempotency
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      observation-enabled: true      # consumer continues the trace
    template:
      observation-enabled: true      # producer adds trace headers
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:${HIRETRACK_KEYS_DIR:../../deploy/dev-keys}/public.pem
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
      env: ${HIRETRACK_ENV:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs                       # JSON logs with traceId/spanId
  file:
    name: ${HIRETRACK_LOG_DIR:../../logs}/resume-service.log
  structured.format.file: ecs

hiretrack:
  internal:
    token: ${HIRETRACK_INTERNAL_TOKEN:dev-internal-token}
  kafka:
    partitions: ${KAFKA_PARTITIONS:3}
    replicas: ${KAFKA_REPLICAS:1}
  resume:
    max-characters: 20000
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}     # S3Mock locally; leave empty on AWS
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:hiretrack-resumes}
    access-key: ${S3_ACCESS_KEY:hiretrack}            # empty on AWS: IRSA role credentials are used
    secret-key: ${S3_SECRET_KEY:hiretrack-secret}
    path-style: ${S3_PATH_STYLE:true}
    server-side-encryption: ${S3_SSE:false}           # true on AWS
    create-bucket: ${S3_CREATE_BUCKET:true}           # false on AWS (Terraform creates it)
---
spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location:          # unset the dev key file
          jwk-set-uri: ${JWKS_URI:http://identity-service/.well-known/jwks.json}
logging:
  file:
    name:                                 # stdout only in Kubernetes
